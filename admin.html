<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZEVORIA — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 2px;
    }

    header span {
      font-size: 13px;
      color: #ccc;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .login-box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: #111;
      color: white;
    }

    .primary:hover {
      background: #333;
    }

    .dashboard {
      display: none;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat small {
      color: #777;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 25px;
    }

    .orders {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    th {
      background: #fafafa;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
    }

    .error {
      color: #b42318;
      margin-top: 10px;
      font-size: 14px;
    }

    .muted {
      color: #777;
    }

    @media (max-width: 700px) {

      header {
        padding: 18px;
      }

      .container {
        margin-top: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .login-box {
        margin: 40px auto;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>ZEVORIA ADMIN</h1>
  <span>Store Management</span>
</header>


<div class="container">

  <!-- LOGIN -->

  <div class="login-box" id="loginBox">

    <h2>Admin Login</h2>

    <p class="muted">
      Enter your admin key to view store orders.
    </p>

    <input
      id="adminKey"
      type="password"
      placeholder="Admin key"
    >

    <button
      class="primary"
      id="loginButton"
    >
      Open Admin Dashboard
    </button>

    <div
      class="error"
      id="loginError"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div class="dashboard" id="dashboard">

    <div class="top-actions">

      <button
        class="primary"
        id="refreshButton"
      >
        Refresh Orders
      </button>

      <button id="logoutButton">
        Logout
      </button>

    </div>


    <div class="stats">

      <div class="stat">

        <small>Total Orders</small>

        <strong id="totalOrders">
          0
        </strong>

      </div>

      <div class="stat">

        <small>Total Sales</small>

        <strong id="totalSales">
          ₹0
        </strong>

      </div>

      <div class="stat">

        <small>Pending Orders</small>

        <strong id="pendingOrders">
          0
        </strong>

      </div>

    </div>


    <div class="orders">

      <table>

        <thead>

          <tr>
            <th>Order</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>

        </thead>

        <tbody id="ordersBody">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

const API_BASE =
  "https://zevoria-backend.onrender.com";


let adminKey =
  localStorage.getItem("zevoriaAdminKey") || "";


const $ = selector =>
  document.querySelector(selector);


const money = number =>
  "₹" +
  Number(number).toLocaleString("en-IN");


async function loadOrders() {

  const response =
    await fetch(
      `${API_BASE}/api/admin/orders`,
      {
        headers: {
          "x-admin-key": adminKey
        }
      }
    );


  const data =
    await response.json().catch(
      () => ({})
    );


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Could not load orders"
    );

  }


  renderOrders(data);

}


function renderOrders(orders) {

  $("#totalOrders").textContent =
    orders.length;


  const totalSales =
    orders.reduce(
      (sum, order) =>
        sum + Number(order.total),
      0
    );


  $("#totalSales").textContent =
    money(totalSales);


  $("#pendingOrders").textContent =
    orders.filter(
      order => order.status === "pending"
    ).length;


  if (!orders.length) {

    $("#ordersBody").innerHTML = `
      <tr>
        <td colspan="7" class="muted">
          No orders found.
        </td>
      </tr>
    `;

    return;
  }


  $("#ordersBody").innerHTML =
    orders.map(order => `

      <tr>

        <td>
          <strong>#${order.id}</strong>
        </td>

        <td>
          ${escapeHtml(order.customer_name)}
        </td>

        <td>
          ${escapeHtml(order.phone)}
        </td>

        <td>
          ${escapeHtml(order.address)}
        </td>

        <td>
          <strong>
            ${money(order.total)}
          </strong>
        </td>

        <td>
          <span class="status">
            ${escapeHtml(order.status)}
          </span>
        </td>

        <td>
          ${escapeHtml(order.created_at)}
        </td>

      </tr>

    `).join("");

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


$("#loginButton").onclick =
  async () => {

    const key =
      $("#adminKey").value.trim();


    if (!key) {

      $("#loginError").textContent =
        "Please enter your admin key.";

      return;

    }


    adminKey = key;


    try {

      await loadOrders();


      localStorage.setItem(
        "zevoriaAdminKey",
        adminKey
      );


      $("#loginBox").style.display =
        "none";

      $("#dashboard").style.display =
        "block";

      $("#loginError").textContent = "";


    } catch (error) {

      $("#loginError").textContent =
        error.message;

      adminKey = "";

    }

  };


$("#refreshButton").onclick =
  async () => {

    try {

      await loadOrders();

    } catch (error) {

      alert(error.message);

    }

  };


$("#logoutButton").onclick =
  () => {

    localStorage.removeItem(
      "zevoriaAdminKey"
    );

    adminKey = "";

    $("#dashboard").style.display =
      "none";

    $("#loginBox").style.display =
      "block";

    $("#adminKey").value = "";

  };


if (adminKey) {

  loadOrders()
    .then(() => {

      $("#loginBox").style.display =
        "none";

      $("#dashboard").style.display =
        "block";

    })
    .catch(() => {

      localStorage.removeItem(
        "zevoriaAdminKey"
      );

      adminKey = "";

    });

}

</script>

</body>
</html>
