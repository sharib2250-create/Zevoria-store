<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ZEVORIA — Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f1e8;
      color: #111;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-family: Georgia, serif;
      letter-spacing: 5px;
      font-size: 30px;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #b89b5e;
    }

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 13px 18px;
      font-weight: 600;
    }

    .btn-dark {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 18px;
    }

    .btn-dark:hover {
      background: #222;
    }

    .error {
      color: #b00020;
      font-size: 14px;
      margin-top: 12px;
    }

    /* DASHBOARD */

    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      background: #111;
      color: white;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-family: Georgia, serif;
      letter-spacing: 4px;
      font-size: 24px;
    }

    .admin-label {
      color: #c8a96b;
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #777;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout-btn:hover {
      border-color: #c8a96b;
      color: #c8a96b;
    }

    .content {
      max-width: 1400px;
      margin: auto;
      padding: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .stat-title {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 700;
      margin-top: 8px;
    }

    .toolbar {
      background: white;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .toolbar input {
      flex: 1;
    }

    .toolbar select {
      width: 200px;
    }

    .orders-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .orders-header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .orders-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .refresh-btn {
      background: #111;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th,
    td {
      text-align: left;
      padding: 15px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    th {
      background: #faf8f3;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    td {
      font-size: 14px;
    }

    .order-id {
      font-weight: 700;
    }

    .customer-name {
      font-weight: 700;
    }

    .customer-email {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .address {
      max-width: 250px;
      color: #555;
      line-height: 1.5;
    }

    .products {
      max-width: 250px;
      line-height: 1.6;
    }

    .total {
      font-weight: 700;
      white-space: nowrap;
    }

    .status-select {
      min-width: 130px;
    }

    .message {
      padding: 15px 20px;
      color: #777;
    }

    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 15px;
      }

      .content {
        padding: 15px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar select {
        width: 100%;
      }

      .login-box {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginPage" class="login-page">

    <div class="login-box">

      <div class="logo">
        ZEVORIA
      </div>

      <div class="login-subtitle">
        Secure Admin Dashboard
      </div>

      <form id="loginForm">

        <label for="adminKey">
          Admin Key
        </label>

        <input
          id="adminKey"
          type="password"
          placeholder="Enter admin key"
          autocomplete="current-password"
          required
        />

        <button
          type="submit"
          class="btn btn-dark"
          id="loginButton"
        >
          Login
        </button>

        <div
          id="loginError"
          class="error"
        ></div>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section
    id="dashboard"
    class="dashboard hidden"
  >

    <header class="topbar">

      <div>
        <div class="brand">
          ZEVORIA
        </div>

        <div class="admin-label">
          ADMIN DASHBOARD
        </div>
      </div>

      <button
        id="logoutButton"
        class="logout-btn"
      >
        Logout
      </button>

    </header>


    <main class="content">

      <!-- STATS -->

      <div class="stats">

        <div class="stat">
          <div class="stat-title">
            Total Orders
          </div>

          <div
            id="totalOrders"
            class="stat-value"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Total Sales
          </div>

          <div
            id="totalSales"
            class="stat-value"
          >
            ₹0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Pending
          </div>

          <div
            id="pendingOrders"
            class="stat-value"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Confirmed
          </div>

          <div
            id="confirmedOrders"
            class="stat-value"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Shipped
          </div>

          <div
            id="shippedOrders"
            class="stat-value"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Delivered
          </div>

          <div
            id="deliveredOrders"
            class="stat-value"
          >
            0
          </div>
        </div>

      </div>


      <!-- SEARCH -->

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="Search order, customer, email or phone..."
        />

        <select id="statusFilter">

          <option value="all">
            All Status
          </option>

          <option value="pending">
            Pending
          </option>

          <option value="confirmed">
            Confirmed
          </option>

          <option value="shipped">
            Shipped
          </option>

          <option value="delivered">
            Delivered
          </option>

          <option value="cancelled">
            Cancelled
          </option>

        </select>

      </div>


      <!-- ORDERS -->

      <section class="orders-box">

        <div class="orders-header">

          <h2>
            All Orders
          </h2>

          <button
            id="refreshButton"
            class="refresh-btn"
          >
            Refresh
          </button>

        </div>


        <div
          id="message"
          class="message"
        >
          Loading orders...
        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  Order
                </th>

                <th>
                  Customer
                </th>

                <th>
                  Address
                </th>

                <th>
                  Products
                </th>

                <th>
                  Total
                </th>

                <th>
                  Date
                </th>

                <th>
                  Status
                </th>

              </tr>

            </thead>

            <tbody id="ordersBody"></tbody>

          </table>

        </div>

      </section>

    </main>

  </section>


<script>

const API_BASE =
  "https://zevoria-backend.onrender.com";

let csrfToken = "";

let allOrders = [];


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
  document.getElementById("loginPage");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const adminKey =
  document.getElementById("adminKey");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const logoutButton =
  document.getElementById("logoutButton");

const searchInput =
  document.getElementById("searchInput");

const statusFilter =
  document.getElementById("statusFilter");

const refreshButton =
  document.getElementById("refreshButton");

const ordersBody =
  document.getElementById("ordersBody");

const message =
  document.getElementById("message");


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    loginError.textContent = "";

    const key =
      adminKey.value.trim();

    if (!key) {
      loginError.textContent =
        "Please enter your Admin Key.";

      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    try {

      const response =
        await fetch(
          `${API_BASE}/api/admin/login`,
          {
            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              adminKey: key
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Login failed"
        );

      }

      csrfToken =
        data.csrfToken;

      /*
        IMPORTANT:
        Admin Key is NOT saved
        in localStorage.
      */

      adminKey.value = "";

      showDashboard();

      await loadDashboard();

    } catch (error) {

      loginError.textContent =
        error.message;

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkSession() {

  try {

    const response =
      await fetch(
        `${API_BASE}/api/admin/me`,
        {
          method: "GET",
          credentials: "include"
        }
      );

    if (!response.ok) {

      showLogin();

      return;

    }

    const data =
      await response.json();

    csrfToken =
      data.csrfToken;

    showDashboard();

    await loadDashboard();

  } catch (error) {

    showLogin();

  }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

  loginPage.classList.remove(
    "hidden"
  );

  dashboard.classList.add(
    "hidden"
  );

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard() {

  loginPage.classList.add(
    "hidden"
  );

  dashboard.classList.remove(
    "hidden"
  );

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  message.textContent =
    "Loading orders...";

  try {

    const [
      ordersResponse,
      statsResponse
    ] = await Promise.all([

      fetch(
        `${API_BASE}/api/admin/orders`,
        {
          credentials: "include"
        }
      ),

      fetch(
        `${API_BASE}/api/admin/stats`,
        {
          credentials: "include"
        }
      )

    ]);


    if (
      ordersResponse.status === 401 ||
      statsResponse.status === 401
    ) {

      showLogin();

      return;

    }


    if (
      !ordersResponse.ok ||
      !statsResponse.ok
    ) {

      throw new Error(
        "Could not load dashboard"
      );

    }


    allOrders =
      await ordersResponse.json();

    const stats =
      await statsResponse.json();


    updateStats(stats);

    renderOrders();

    message.textContent = "";

  } catch (error) {

    message.textContent =
      error.message;

  }

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(stats) {

  document.getElementById(
    "totalOrders"
  ).textContent =
    stats.totalOrders || 0;


  document.getElementById(
    "totalSales"
  ).textContent =
    formatMoney(
      stats.totalSales || 0
    );


  document.getElementById(
    "pendingOrders"
  ).textContent =
    stats.pending || 0;


  document.getElementById(
    "confirmedOrders"
  ).textContent =
    stats.confirmed || 0;


  document.getElementById(
    "shippedOrders"
  ).textContent =
    stats.shipped || 0;


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    stats.delivered || 0;

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const filter =
    statusFilter.value;


  const filtered =
    allOrders.filter(
      (order) => {

        const searchable = [

          order.id,

          order.customer_name,

          order.customer_email,

          order.phone,

          order.address

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          !search ||
          searchable.includes(search);


        const matchesStatus =
          filter === "all" ||
          order.status === filter;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  ordersBody.innerHTML = "";


  if (!filtered.length) {

    message.textContent =
      "No orders found.";

    return;

  }


  message.textContent = "";


  filtered.forEach(
    (order) => {

      const row =
        document.createElement("tr");


      const products =
        (order.items || [])
          .map(
            (item) =>
              `${escapeHtml(item.name)}
              × ${item.qty}`
          )
          .join("<br>");


      row.innerHTML = `

        <td>

          <div class="order-id">
            #${order.id}
          </div>

        </td>


        <td>

          <div class="customer-name">
            ${escapeHtml(
              order.customer_name
            )}
          </div>

          <div class="customer-email">
            ${escapeHtml(
              order.customer_email || ""
            )}
          </div>

          <div class="customer-email">
            ${escapeHtml(
              order.phone || ""
            )}
          </div>

        </td>


        <td>

          <div class="address">
            ${escapeHtml(
              order.address
            )}
          </div>

        </td>


        <td>

          <div class="products">
            ${products}
          </div>

        </td>


        <td>

          <div class="total">
            ${formatMoney(
              order.total
            )}
          </div>

          <div class="customer-email">
            COD
          </div>

        </td>


        <td>

          ${formatDate(
            order.created_at
          )}

        </td>


        <td>

          <select
            class="status-select"
            data-order-id="${order.id}"
          >

            ${statusOption(
              "pending",
              order.status
            )}

            ${statusOption(
              "confirmed",
              order.status
            )}

            ${statusOption(
              "shipped",
              order.status
            )}

            ${statusOption(
              "delivered",
              order.status
            )}

            ${statusOption(
              "cancelled",
              order.status
            )}

          </select>

        </td>

      `;


      ordersBody.appendChild(row);

    }
  );


  document
    .querySelectorAll(
      ".status-select"
    )
    .forEach(
      (select) => {

        select.addEventListener(
          "change",
          async () => {

            const orderId =
              select.dataset.orderId;

            await updateOrderStatus(
              orderId,
              select.value
            );

          }
        );

      }
    );

}


/* =====================================================
   STATUS OPTION
===================================================== */

function statusOption(
  value,
  current
) {

  const label =
    value.charAt(0).toUpperCase() +
    value.slice(1);

  return `

    <option
      value="${value}"
      ${value === current ? "selected" : ""}
    >
      ${label}
    </option>

  `;

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
  orderId,
  status
) {

  try {

    const response =
      await fetch(
        `${API_BASE}/api/admin/orders/${orderId}/status`,
        {
          method: "PATCH",

          credentials: "include",

          headers: {
            "Content-Type":
              "application/json",

            "X-CSRF-Token":
              csrfToken
          },

          body: JSON.stringify({
            status
          })
        }
      );


    if (
      response.status === 401
    ) {

      showLogin();

      return;

    }


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Could not update status"
      );

    }


    await loadDashboard();


  } catch (error) {

    alert(error.message);

  }

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    try {

      await fetch(
        `${API_BASE}/api/admin/logout`,
        {
          method: "POST",

          credentials: "include",

          headers: {
            "X-CSRF-Token":
              csrfToken
          }
        }
      );

    } catch (error) {

      console.error(error);

    }


    csrfToken = "";

    allOrders = [];

    showLogin();

  }
);


/* =====================================================
   REFRESH
===================================================== */

refreshButton.addEventListener(
  "click",
  async () => {

    await loadDashboard();

  }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderOrders
);


statusFilter.addEventListener(
  "change",
  renderOrders
);


/* =====================================================
   HELPERS
===================================================== */

function formatMoney(value) {

  return new Intl.NumberFormat(
    "en-IN",
    {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 0
    }
  ).format(
    Number(value) || 0
  );

}


function formatDate(value) {

  if (!value) return "-";

  const date =
    new Date(
      value.replace(" ", "T") +
      "Z"
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }

  return date.toLocaleString(
    "en-IN"
  );

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>
</html>
