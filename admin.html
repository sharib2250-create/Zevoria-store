<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZEVORIA Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      background: #0d0d0d;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-gold {
      width: 100%;
      background: #d4af37;
      color: #111;
    }

    .btn-gold:hover {
      background: #e5c354;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    /* =========================
       HEADER
    ========================= */

    .admin-header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 18px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .admin-logo {
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .header-btn {
      background: #1d1d1d;
      color: white;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .header-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      max-width: 1400px;
      margin: auto;
      padding: 30px;
    }

    .dashboard-title {
      margin-bottom: 25px;
    }

    .dashboard-title h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .dashboard-title p {
      color: #999;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label {
      color: #999;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-value {
      color: #d4af37;
      font-size: 25px;
      font-weight: bold;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 18px;

      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 15px;

      margin-bottom: 20px;
    }

    /* =========================
       ORDERS
    ========================= */

    .orders-box {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 12px;
      overflow: hidden;
    }

    .orders-header {
      padding: 18px;
      border-bottom: 1px solid #303030;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .orders-header h2 {
      font-size: 20px;
    }

    .order-count {
      color: #999;
      font-size: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #292929;
      vertical-align: top;
    }

    th {
      color: #d4af37;
      font-size: 13px;
      background: #111;
    }

    td {
      color: #ddd;
      font-size: 14px;
    }

    tr:hover td {
      background: #181818;
    }

    .order-id {
      color: #d4af37;
      font-weight: bold;
    }

    .customer-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .phone {
      color: #999;
      font-size: 13px;
    }

    .address {
      color: #aaa;
      line-height: 1.5;
      max-width: 230px;
    }

    /* =========================
       ITEMS
    ========================= */

    .items {
      min-width: 190px;
    }

    .item {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #292929;
    }

    .item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .item-name {
      color: white;
      font-weight: bold;
    }

    .item-info {
      color: #999;
      font-size: 12px;
      margin-top: 3px;
    }

    /* =========================
       STATUS
    ========================= */

    .status-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 150px;
    }

    .status-select {
      padding: 9px;
      border-radius: 7px;
      background: #0c0c0c;
      color: white;
      border: 1px solid #444;
    }

    .status-select.pending {
      border-color: #e6a700;
    }

    .status-select.confirmed {
      border-color: #4dabf7;
    }

    .status-select.shipped {
      border-color: #9b59b6;
    }

    .status-select.delivered {
      border-color: #2ecc71;
    }

    .status-select.cancelled {
      border-color: #e74c3c;
    }

    .update-btn {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .update-btn:hover {
      background: #e5c354;
    }

    .update-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       DATE / TOTAL
    ========================= */

    .total {
      color: #d4af37;
      font-weight: bold;
      white-space: nowrap;
    }

    .date {
      color: #999;
      white-space: nowrap;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 50px;
      text-align: center;
      color: #888;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;

      background: #1d1d1d;
      border: 1px solid #d4af37;
      color: white;

      padding: 14px 18px;
      border-radius: 8px;

      display: none;
      z-index: 9999;
    }

    .toast.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1100px) {

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      .admin-header {
        padding: 15px;
      }

      .admin-logo {
        font-size: 18px;
      }

      .header-actions {
        gap: 5px;
      }

      .header-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .dashboard {
        padding: 15px;
      }

      .dashboard-title h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-card {
        padding: 15px;
      }

      .stat-value {
        font-size: 21px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .orders-header {
        padding: 15px;
      }

    }

    @media (max-width: 420px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
      }

      .header-btn {
        flex: 1;
      }

    }

  </style>
</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginView" class="login-page">

  <div class="login-box">

    <div class="logo">
      ZEVORIA
    </div>

    <div class="login-subtitle">
      Admin Dashboard
    </div>

    <form id="adminLoginForm">

      <div class="form-group">

        <label for="adminKey">
          Admin Key
        </label>

        <input
          type="password"
          id="adminKey"
          placeholder="Enter admin key"
          required
        >

      </div>

      <button
        type="submit"
        class="btn btn-gold"
      >
        Login to Dashboard
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </form>

  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboardView" class="hidden">

  <header class="admin-header">

    <div class="admin-logo">
      ZEVORIA ADMIN
    </div>

    <div class="header-actions">

      <button
        class="header-btn"
        id="refreshBtn"
      >
        ↻ Refresh
      </button>

      <button
        class="header-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="dashboard">

    <div class="dashboard-title">

      <h1>
        Dashboard
      </h1>

      <p>
        Manage your ZEVORIA orders
      </p>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <section class="stats">

      <div class="stat-card">

        <div class="stat-label">
          Total Orders
        </div>

        <div
          class="stat-value"
          id="totalOrders"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Total Sales
        </div>

        <div
          class="stat-value"
          id="totalSales"
        >
          ₹0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Pending
        </div>

        <div
          class="stat-value"
          id="pendingOrders"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Confirmed
        </div>

        <div
          class="stat-value"
          id="confirmedOrders"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Shipped
        </div>

        <div
          class="stat-value"
          id="shippedOrders"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Delivered
        </div>

        <div
          class="stat-value"
          id="deliveredOrders"
        >
          0
        </div>

      </div>

    </section>


    <!-- =========================
         SEARCH / FILTER
    ========================= -->

    <section class="controls">

      <input
        type="search"
        id="searchInput"
        placeholder="Search by order, customer, phone, address or product..."
      >

      <select id="statusFilter">

        <option value="all">
          All Status
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="confirmed">
          Confirmed
        </option>

        <option value="shipped">
          Shipped
        </option>

        <option value="delivered">
          Delivered
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>

    </section>


    <!-- =========================
         ORDERS
    ========================= -->

    <section class="orders-box">

      <div class="orders-header">

        <h2>
          Orders
        </h2>

        <div
          class="order-count"
          id="orderCount"
        >
          0 orders
        </div>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Order
              </th>

              <th>
                Customer
              </th>

              <th>
                Address
              </th>

              <th>
                Products
              </th>

              <th>
                Total
              </th>

              <th>
                Date
              </th>

              <th>
                Status
              </th>

            </tr>

          </thead>

          <tbody id="ordersBody">
          </tbody>

        </table>

      </div>

      <div
        id="emptyOrders"
        class="empty hidden"
      >
        No orders found.
      </div>

    </section>

  </main>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

  const API_BASE =
    "https://zevoria-backend.onrender.com";


  let adminKey =
    localStorage.getItem("zevoriaAdminKey") || "";

  let allOrders = [];


  /* =========================
     ELEMENTS
  ========================= */

  const loginView =
    document.getElementById("loginView");

  const dashboardView =
    document.getElementById("dashboardView");

  const adminLoginForm =
    document.getElementById("adminLoginForm");

  const adminKeyInput =
    document.getElementById("adminKey");

  const loginError =
    document.getElementById("loginError");

  const ordersBody =
    document.getElementById("ordersBody");

  const emptyOrders =
    document.getElementById("emptyOrders");

  const searchInput =
    document.getElementById("searchInput");

  const statusFilter =
    document.getElementById("statusFilter");


  /* =========================
     FORMAT MONEY
  ========================= */

  function money(value) {

    return new Intl.NumberFormat(
      "en-IN",
      {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }
    ).format(Number(value) || 0);

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     DATE
  ========================= */

  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(
        value.replace(" ", "T") + "Z"
      );

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString(
      "en-IN",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );

  }


  /* =========================
     TOAST
  ========================= */

  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

      toast.classList.remove("show");

    }, 2500);

  }


  /* =========================
     LOGIN
  ========================= */

  adminLoginForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const key =
        adminKeyInput.value.trim();

      if (!key) {
        return;
      }

      loginError.textContent =
        "Checking...";


      try {

        const response =
          await fetch(
            `${API_BASE}/api/admin/orders`,
            {
              headers: {
                "x-admin-key": key
              }
            }
          );


        if (!response.ok) {

          loginError.textContent =
            "Invalid admin key.";

          return;

        }


        adminKey = key;

        localStorage.setItem(
          "zevoriaAdminKey",
          adminKey
        );


        loginError.textContent = "";

        loginView.classList.add("hidden");

        dashboardView.classList.remove("hidden");

        await loadOrders();

      }

      catch (error) {

        console.error(error);

        loginError.textContent =
          "Could not connect to backend.";

      }

    }
  );


  /* =========================
     LOAD ORDERS
  ========================= */

  async function loadOrders() {

    try {

      const response =
        await fetch(
          `${API_BASE}/api/admin/orders`,
          {
            headers: {
              "x-admin-key": adminKey
            }
          }
        );


      if (response.status === 401) {

        logout();

        return;

      }


      if (!response.ok) {

        throw new Error(
          "Could not load orders"
        );

      }


      allOrders =
        await response.json();


      updateStats();

      renderOrders();

    }

    catch (error) {

      console.error(error);

      showToast(
        "Could not load orders."
      );

    }

  }


  /* =========================
     STATS
  ========================= */

  function updateStats() {

    const total =
      allOrders.length;


    const sales =
      allOrders
        .filter(
          order =>
            order.status !== "cancelled"
        )
        .reduce(
          (sum, order) =>
            sum + Number(order.total || 0),
          0
        );


    const pending =
      allOrders.filter(
        order =>
          order.status === "pending"
      ).length;


    const confirmed =
      allOrders.filter(
        order =>
          order.status === "confirmed"
      ).length;


    const shipped =
      allOrders.filter(
        order =>
          order.status === "shipped"
      ).length;


    const delivered =
      allOrders.filter(
        order =>
          order.status === "delivered"
      ).length;


    document.getElementById(
      "totalOrders"
    ).textContent = total;


    document.getElementById(
      "totalSales"
    ).textContent = money(sales);


    document.getElementById(
      "pendingOrders"
    ).textContent = pending;


    document.getElementById(
      "confirmedOrders"
    ).textContent = confirmed;


    document.getElementById(
      "shippedOrders"
    ).textContent = shipped;


    document.getElementById(
      "deliveredOrders"
    ).textContent = delivered;

  }


  /* =========================
     FILTER ORDERS
  ========================= */

  function getFilteredOrders() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    const status =
      statusFilter.value;


    return allOrders.filter(
      order => {

        if (
          status !== "all" &&
          order.status !== status
        ) {
          return false;
        }


        if (!search) {
          return true;
        }


        const productText =
          (order.items || [])
            .map(item => item.name)
            .join(" ");


        const text = [

          order.id,

          order.customer_name,

          order.phone,

          order.address,

          order.status,

          productText

        ]
          .join(" ")
          .toLowerCase();


        return text.includes(search);

      }
    );

  }


  /* =========================
     RENDER ORDERS
  ========================= */

  function renderOrders() {

    const orders =
      getFilteredOrders();


    document.getElementById(
      "orderCount"
    ).textContent =
      `${orders.length} ${
        orders.length === 1
          ? "order"
          : "orders"
      }`;


    if (!orders.length) {

      ordersBody.innerHTML = "";

      emptyOrders.classList.remove(
        "hidden"
      );

      return;

    }


    emptyOrders.classList.add(
      "hidden"
    );


    ordersBody.innerHTML =
      orders.map(
        order => {

          const itemsHTML =
            (order.items || [])
              .map(
                item => `
                  <div class="item">

                    <div class="item-name">
                      ${escapeHTML(item.name)}
                    </div>

                    <div class="item-info">
                      Qty: ${item.qty}
                      × ${money(item.price)}
                    </div>

                  </div>
                `
              )
              .join("");


          return `

            <tr>

              <td>

                <div class="order-id">
                  #${order.id}
                </div>

              </td>


              <td>

                <div class="customer-name">
                  ${escapeHTML(order.customer_name)}
                </div>

                <div class="phone">
                  ${escapeHTML(order.phone)}
                </div>

              </td>


              <td>

                <div class="address">
                  ${escapeHTML(order.address)}
                </div>

              </td>


              <td>

                <div class="items">
                  ${itemsHTML}
                </div>

              </td>


              <td>

                <div class="total">
                  ${money(order.total)}
                </div>

              </td>


              <td>

                <div class="date">
                  ${formatDate(order.created_at)}
                </div>

              </td>


              <td>

                <div class="status-box">

                  <select
                    class="status-select ${escapeHTML(order.status)}"
                    data-order-id="${order.id}"
                  >

                    <option
                      value="pending"
                      ${order.status === "pending" ? "selected" : ""}
                    >
                      Pending
                    </option>

                    <option
                      value="confirmed"
                      ${order.status === "confirmed" ? "selected" : ""}
                    >
                      Confirmed
                    </option>

                    <option
                      value="shipped"
                      ${order.status === "shipped" ? "selected" : ""}
                    >
                      Shipped
                    </option>

                    <option
                      value="delivered"
                      ${order.status === "delivered" ? "selected" : ""}
                    >
                      Delivered
                    </option>

                    <option
                      value="cancelled"
                      ${order.status === "cancelled" ? "selected" : ""}
                    >
                      Cancelled
                    </option>

                  </select>


                  <button
                    class="update-btn"
                    data-update-id="${order.id}"
                  >
                    Update
                  </button>

                </div>

              </td>

            </tr>

          `;

        }
      ).join("");


    attachUpdateButtons();

  }


  /* =========================
     UPDATE STATUS BUTTONS
  ========================= */

  function attachUpdateButtons() {

    document
      .querySelectorAll(
        ".update-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const orderId =
                button.dataset.updateId;


              const select =
                document.querySelector(
                  `.status-select[data-order-id="${orderId}"]`
                );


              if (!select) {
                return;
              }


              updateOrderStatus(
                orderId,
                select.value,
                button
              );

            }
          );

        }
      );

  }


  /* =========================
     UPDATE ORDER STATUS
  ========================= */

  async function updateOrderStatus(
    orderId,
    status,
    button
  ) {

    const oldText =
      button.textContent;


    button.disabled = true;

    button.textContent =
      "Updating...";


    try {

      const response =
        await fetch(
          `${API_BASE}/api/admin/orders/${orderId}/status`,
          {
            method: "PATCH",

            headers: {
              "Content-Type": "application/json",
              "x-admin-key": adminKey
            },

            body: JSON.stringify({
              status
            })
          }
        );


      if (response.status === 401) {

        logout();

        return;

      }


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Could not update status"
        );

      }


      const order =
        allOrders.find(
          item =>
            Number(item.id) ===
            Number(orderId)
        );


      if (order) {
        order.status = status;
      }


      updateStats();

      renderOrders();

      showToast(
        `Order #${orderId} updated to ${status}.`
      );

    }

    catch (error) {

      console.error(error);

      showToast(
        error.message ||
        "Could not update order."
      );

      button.disabled = false;

      button.textContent =
        oldText;

    }

  }


  /* =========================
     SEARCH
  ========================= */

  searchInput.addEventListener(
    "input",
    renderOrders
  );


  /* =========================
     FILTER
  ========================= */

  statusFilter.addEventListener(
    "change",
    renderOrders
  );


  /* =========================
     REFRESH
  ========================= */

  document
    .getElementById("refreshBtn")
    .addEventListener(
      "click",
      async () => {

        await loadOrders();

        showToast(
          "Orders refreshed."
        );

      }
    );


  /* =========================
     LOGOUT
  ========================= */

  function logout() {

    localStorage.removeItem(
      "zevoriaAdminKey"
    );

    adminKey = "";

    allOrders = [];

    dashboardView.classList.add(
      "hidden"
    );

    loginView.classList.remove(
      "hidden"
    );

    adminKeyInput.value = "";

    loginError.textContent = "";

  }


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      logout
    );


  /* =========================
     AUTO LOGIN
  ========================= */

  async function startAdmin() {

    if (!adminKey) {
      return;
    }


    try {

      const response =
        await fetch(
          `${API_BASE}/api/admin/orders`,
          {
            headers: {
              "x-admin-key": adminKey
            }
          }
        );


      if (!response.ok) {

        localStorage.removeItem(
          "zevoriaAdminKey"
        );

        adminKey = "";

        return;

      }


      loginView.classList.add(
        "hidden"
      );

      dashboardView.classList.remove(
        "hidden"
      );

      await loadOrders();

    }

    catch (error) {

      console.error(error);

    }

  }


  startAdmin();

</script>

</body>
</html>
